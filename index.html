<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Name
    </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registration.css">
</head>

<body>
    <div id="login">
        <h2 id="loginheader">Login Page</h2>
        
        <div id="emailsect">
            <label for="email" class="email">Email:</label>
            <input type="text" id="email" class="email" required />
        </div>

        <div id="passwordsect">
            <label for="password" class="password">Password:</label>
            <input type="password" id="password" class="password" required />
        </div>

        <button id="loginbutton"><a href="attedance.html">Login</a></button>

        <div id="miscsec">
            <button id="register" class="misc">Register</button>
            <button id="forgot" class="misc">Forgot password?</button>
        </div>
    </div>

    <div id="regpanel">
        <section>
            <label for="sid" class="sid">Student ID:</label>
            <input type="text" id="sid" class="sid" required />
        </section>

        <section>
            <label for="fname" class="fname">Fisrt Name:</label>
            <input type="text" id="fname" class="fname" required>
        </section>

        <section>
            <label for="lname" class="lname">Last Name:</label>
            <input type="text" id="lname" class="lname" required>
        </section>

        <section>
            <label for="program" class="program">Program:</label>
            <input type="text" id="program" class="program" required>
        </section>

        <section>
            <label for="emailr" class="">Email:</label>
            <input type="text" id="emailr" class="emailr" required>
        </section>

        <section>
            <label for="passwordr" class="passwordr">Password:</label>
            <input type="password" id="passwordr" class="passwordr" required>
        </section>

    </div>
</body>

</html>
